<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=VT323&family=Gluten:wght@400..900&display=swap" rel="stylesheet">
    <title>The Mirror Within - Opções</title>
</head>
<body id="opcoes">
    <main class="stage stage-opcoes">
        <a class="voltar-opcoes" href="index.html" aria-label="Voltar"></a>

        <div class="painel-opcoes">
            <div class="abas">
                <button class="aba aba-ativa" type="button" id="aba-controles">Controles</button>
                <button class="aba" type="button" id="aba-sistema">Sistema</button>
            </div>

            <form class="caixa-opcoes" id="form-opcoes">
                <div class="botoes-opcoes">
                    <button class="botao-opcao botao-ativo" type="submit">SALVAR</button>
                    <button class="botao-opcao" type="button" id="cancelar">CANCELAR</button>
                    <button class="botao-opcao" type="button" id="restaurar">RESTAURAR</button>
                </div>
                <p class="aviso-form" id="aviso"></p>

                <div id="painel-controles">
                    <table class="tabela-controles">
                        <thead>
                            <tr>
                                <th>AÇÕES</th>
                                <th>TECLADO</th>
                                <th>CONTROLE</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><th>Movimento (Frente)</th><td><div class="caixa-tecla">W</div></td><td><div class="caixa-tecla">D-Pad ↑</div></td></tr>
                            <tr><th>Movimento (Trás)</th><td><div class="caixa-tecla">S</div></td><td><div class="caixa-tecla">D-Pad ↓</div></td></tr>
                            <tr><th>Movimento (Esquerda)</th><td><div class="caixa-tecla">A</div></td><td><div class="caixa-tecla">D-Pad ←</div></td></tr>
                            <tr><th>Movimento (Direita)</th><td><div class="caixa-tecla">D</div></td><td><div class="caixa-tecla">D-Pad →</div></td></tr>
                            <tr><th>Interagir</th><td><div class="caixa-tecla">R</div></td><td><div class="caixa-tecla"><span class="simbolo-circulo">O</span></div></td></tr>
                            <tr><th>Abrir Inventário</th><td><div class="caixa-tecla">G / TAB</div></td><td><div class="caixa-tecla"><span class="simbolo-triangulo">Δ</span></div></td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="painel-sistema" class="escondido">
                    <ul class="lista-sistema">
                        <li>
                            <label for="musica">Música:</label>
                            <div class="pilula"><input type="range" id="musica" min="0" max="100" step="5"><output id="musica-val">100%</output></div>
                        </li>
                        <li>
                            <label for="efeitos">Efeitos Sonoros:</label>
                            <div class="pilula"><input type="range" id="efeitos" min="0" max="100" step="5"><output id="efeitos-val">100%</output></div>
                        </li>
                        <li>
                            <span>Tela Cheia:</span>
                            <div class="pilula"><button type="button" id="tela-cheia">ON</button></div>
                        </li>
                        <li>
                            <span>Idioma:</span>
                            <div class="pilula valor-config">Português (BR)</div>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>

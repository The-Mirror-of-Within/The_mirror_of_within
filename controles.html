<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=VT323&family=Goldman:wght@400;700&family=Gluten:wght@400..900&display=swap" rel="stylesheet">
    <title>The Mirror of Within — Controles</title>
</head>
<body>
    <div class="stage stage-controles">

        <a class="voltar-controles" href="jogo-rodando.html" aria-label="Voltar"></a>

        <div class="painel-controles"></div>

        <div class="abas-controles">
            <span class="aba aba-ativa">Controles</span>
            <span class="aba">Sistema</span>
        </div>

        <div class="caixa-controles">

            <div class="controles-botoes">
                <span class="botao-controle botao-ativo">SALVAR</span>
                <span class="botao-controle">CANCELAR</span>
                <span class="botao-controle">RESTAURAR</span>
            </div>

            <div class="tabela-controles">
                <div class="tabela-cabecalho">AÇÕES</div>
                <div class="tabela-cabecalho">TECLADO</div>
                <div class="tabela-cabecalho">CONTROLE</div>

                <div class="tabela-acao">Movimento (Frente)</div>
                <div class="tabela-tecla">W</div>
                <div class="tabela-controle-item">D-Pad <span class="seta-dpad">↑</span></div>

                <div class="tabela-acao">Movimento (Trás)</div>
                <div class="tabela-tecla">S</div>
                <div class="tabela-controle-item">D-Pad <span class="seta-dpad">↓</span></div>

                <div class="tabela-acao">Movimento (Esquerda)</div>
                <div class="tabela-tecla">A</div>
                <div class="tabela-controle-item">D-Pad <span class="seta-dpad">←</span></div>

                <div class="tabela-acao">Movimento (Direita)</div>
                <div class="tabela-tecla">D</div>
                <div class="tabela-controle-item">D-Pad <span class="seta-dpad">→</span></div>

                <div class="tabela-acao">Interagir</div>
                <div class="tabela-tecla">R</div>
                <div class="tabela-controle-item"><span class="simbolo-circulo">O</span></div>

                <div class="tabela-acao">Abrir Inventário</div>
                <div class="tabela-tecla">G</div>
                <div class="tabela-controle-item"><span class="simbolo-triangulo">Δ</span></div>
            </div>

        </div>
    </div>
</body>
</html>
